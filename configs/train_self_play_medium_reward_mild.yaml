seed: 2032
init_checkpoint: "experiments/checkpoints/board_mamba_real_medium_joint.pt"
model:
  name: "board_mamba"
  kwargs:
    d_model: 128
    n_layers: 3
    d_state: 16
    dropout: 0.1
data:
  self_play: "data/self_play/self_play_medium_reward_mild.parquet"
  val_frac: 0.1
train:
  batch_size: 128
  epochs: 3
  lr: 0.00002
  weight_decay: 0.01
  lambda_value: 0.25
output:
  metrics: "experiments/results/self_play_medium_reward_mild_metrics_real_mamba.csv"
  checkpoint: "experiments/checkpoints/board_mamba_real_medium_self_play_mild.pt"
