seed: 2030
model:
  name: "board_mamba"
  kwargs:
    d_model: 128
    n_layers: 3
    d_state: 16
    dropout: 0.1
data:
  train: "data/processed_medium/policy_train.parquet"
  val: "data/processed_medium/policy_val.parquet"
  value_train: "data/value_labels_medium/stockfish_values_train.parquet"
  value_val: "data/value_labels_medium/stockfish_values_val.parquet"
train:
  batch_size: 512
  epochs: 2
  lr: 0.0003
  weight_decay: 0.01
output:
  metrics: "experiments/results/policy_metrics_medium_real_mamba.csv"
  value_metrics: "experiments/results/value_metrics_medium_real_mamba.csv"
  checkpoint: "experiments/checkpoints/board_mamba_real_medium_policy.pt"
  value_checkpoint: "experiments/checkpoints/board_mamba_real_medium_value.pt"
