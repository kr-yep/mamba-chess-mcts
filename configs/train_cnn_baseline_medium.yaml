seed: 2030
model:
  name: "cnn_baseline"
  kwargs:
    channels: 96
    n_blocks: 3
    dropout: 0.1
data:
  train: "data/processed_medium/policy_train.parquet"
  val: "data/processed_medium/policy_val.parquet"
  value_train: "data/value_labels_medium/stockfish_values_train.parquet"
  value_val: "data/value_labels_medium/stockfish_values_val.parquet"
train:
  batch_size: 512
  epochs: 2
  lr: 0.0003
  weight_decay: 0.01
output:
  metrics: "experiments/results/policy_metrics_medium_cnn.csv"
  value_metrics: "experiments/results/value_metrics_medium_cnn.csv"
  checkpoint: "experiments/checkpoints/cnn_baseline_medium_policy.pt"
  value_checkpoint: "experiments/checkpoints/cnn_baseline_medium_value.pt"
