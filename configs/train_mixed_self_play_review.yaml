seed: 2029
init_checkpoint: "experiments/checkpoints/board_mamba_real_self_play_reward_mild.pt"
model:
  name: "board_mamba"
  kwargs:
    d_model: 128
    n_layers: 3
    d_state: 16
    dropout: 0.1
data:
  self_play: "data/self_play/self_play_real_mamba_reward_mild.parquet"
  review_policy: "data/processed/review_policy_reward_mild.parquet"
train:
  batch_size: 64
  epochs: 3
  lr: 0.00002
  weight_decay: 0.01
  lambda_value: 0.25
  review_weight: 0.25
output:
  metrics: "experiments/results/mixed_self_play_review_metrics_real_mamba.csv"
  checkpoint: "experiments/checkpoints/board_mamba_real_mixed_review.pt"
