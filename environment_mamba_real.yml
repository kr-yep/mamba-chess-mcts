name: mamba-chess-real
channels:
  - nvidia
  - pytorch
  - conda-forge
dependencies:
  - python=3.11
  - pip
  - cuda-nvcc=12.1
  - cuda-cudart-dev=12.1
  - cuda-cccl=12.1
  - pip:
      - --extra-index-url https://download.pytorch.org/whl/cu121
      - torch==2.3.1+cu121
      - torchvision==0.18.1+cu121
      - numpy
      - pandas
      - pyarrow
      - tqdm
      - matplotlib
      - scikit-learn
      - python-chess
      - zstandard
      - pyyaml
      - tensorboard
      - tabulate
      - einops
      - pytest
      - ruff
      - black
      - mypy
      - seaborn
      - wandb
      - transformers==4.44.2
      - causal-conv1d==1.4.0
      - mamba-ssm==2.2.2
